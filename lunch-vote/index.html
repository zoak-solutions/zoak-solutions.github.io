<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poll Vote — ZOAK Solutions</title>
  <meta name="description" content="Vote in a ZOAK Solutions poll." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'" />
  <style>
    :root {
      --color-background: #0e0e0e;
      --color-surface: #1a1a1a;
      --color-card: #202020;
      --color-primary: #D7881D;
      --color-secondary: #F9DC06;
      --color-success: #2ECC71;
      --color-error: #F08080;
      --color-text-primary: #ffffff;
      --color-text-secondary: #cccccc;
      --color-border: #333333;
      --color-accent: #69747A;
      --shadow-lg: 0 12px 36px rgba(0,0,0,.35);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top right, rgba(215,136,29,.14), transparent 28%), var(--color-background);
      color: var(--color-text-primary);
      line-height: 1.65;
    }
    a { color: var(--color-primary); text-decoration: none; }
    button, input, textarea { font: inherit; }
    img { max-width: 100%; }
    .container { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: rgba(14,14,14,.84);
      border-bottom: 1px solid var(--color-border);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }
    .topbar-inner {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: 1rem 0;
    }
    .brand { font-weight: 700; color: var(--color-text-primary); }
    .home-link {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .65rem 1rem; border-radius: 999px; border: 1px solid var(--color-border);
      color: var(--color-text-primary); background: var(--color-surface);
    }
    main { padding: 3.5rem 0 4rem; }
    .hero { margin-bottom: 2rem; }
    .eyebrow {
      display: inline-block; padding: .3rem .8rem; border-radius: 999px;
      background: rgba(215,136,29,.12); color: var(--color-primary);
      font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    }
    h1 {
      margin: 1rem 0 .75rem;
      font-size: clamp(2.4rem, 6vw, 4.25rem);
      line-height: 1.05;
    }
    h2 { margin: 0 0 .4rem; font-size: 1.35rem; }
    p { color: var(--color-text-secondary); }
    .lede { max-width: 64ch; color: var(--color-text-secondary); font-size: 1.05rem; }
    .timer {
      display: none;
      width: max-content;
      margin-top: 1rem;
      padding: .5rem .85rem;
      border: 1px solid rgba(249,220,6,.42);
      border-radius: 999px;
      color: var(--color-secondary);
      background: rgba(249,220,6,.08);
      font-weight: 800;
    }
    .timer.visible { display: block; }
    .hero-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: .85rem;
      margin-top: 1.75rem;
    }
    .hero-option {
      display: grid;
      grid-template-rows: 112px minmax(86px, auto);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: hidden;
      padding: 0;
      cursor: pointer;
      background: var(--color-card);
      color: var(--color-text-primary);
      box-shadow: var(--shadow-lg);
    }
    .hero-option[aria-pressed="true"] {
      border-color: var(--color-secondary);
      box-shadow: 0 0 0 3px rgba(249,220,6,.18), var(--shadow-lg);
    }
    .hero-option.voted {
      border-color: var(--color-success);
      box-shadow: 0 0 0 3px rgba(46,204,113,.24), var(--shadow-lg);
    }
    .hero-option img { width: 100%; height: 112px; object-fit: cover; display: block; }
    .thumb-overlay {
      display: grid; gap: .2rem;
      align-content: start;
      padding: .75rem .85rem; text-align: left;
      background: rgba(0,0,0,.76);
    }
    .thumb-overlay span {
      color: var(--color-text-secondary);
      font-size: .86rem;
      line-height: 1.3;
    }
    .content-grid { display: grid; grid-template-columns: minmax(0, 1.04fr) minmax(320px, .96fr); gap: 1rem; align-items: start; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)), var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 1.75rem;
    }
    .card-header { display: flex; justify-content: space-between; gap: 1rem; align-items: start; margin-bottom: 1rem; }
    form { display: grid; gap: 1rem; }
    label, legend { color: var(--color-text-primary); font-weight: 700; }
    fieldset { border: 0; padding: 0; margin: 0; }
    textarea {
      width: 100%; min-height: 96px; resize: vertical;
      border: 1px solid var(--color-border); border-radius: 8px;
      background: var(--color-surface); color: var(--color-text-primary);
      padding: .85rem 1rem; outline: none;
    }
    .option-grid { display: grid; gap: .75rem; margin-top: .65rem; }
    .option-radio {
      position: relative; display: grid; gap: .55rem;
      border: 1px solid var(--color-border); border-radius: 8px;
      background: rgba(255,255,255,.025); padding: 1rem; cursor: pointer;
    }
    .option-radio.selected { border-color: var(--color-secondary); background: rgba(249,220,6,.07); }
    .option-radio.voted { border-color: var(--color-success); background: rgba(46,204,113,.08); }
    .option-radio input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .option-radio strong { color: var(--color-text-primary); }
    .option-radio small { color: var(--color-text-secondary); }
    .tag-list { display: flex; flex-wrap: wrap; gap: .4rem; }
    .tag {
      display: inline-flex; gap: .25rem; align-items: center;
      border-radius: 999px; padding: .16rem .5rem;
      background: rgba(255,255,255,.08); color: var(--color-text-secondary);
      font-size: .78rem;
    }
    .tag b { color: var(--color-secondary); }
    .status, .notice {
      display: none; border: 1px solid var(--color-border); border-radius: 8px;
      padding: .8rem .95rem; color: var(--color-text-secondary); background: rgba(255,255,255,.03);
    }
    .status.visible, .notice.visible { display: block; }
    .status.success { border-color: rgba(46,204,113,.55); color: var(--color-success); }
    .status.error { border-color: rgba(240,128,128,.6); color: var(--color-error); }
    .status.pending { border-color: rgba(215,136,29,.6); color: var(--color-primary); }
    .notice { border-color: rgba(249,220,6,.4); color: var(--color-secondary); }
    .honeypot { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .primary-button, .secondary-button {
      min-height: 46px; border: 1px solid transparent; border-radius: 999px;
      cursor: pointer; font-weight: 800;
    }
    .primary-button { color: #111; background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); padding: .85rem 1.2rem; }
    .secondary-button { color: var(--color-text-primary); background: var(--color-surface); border-color: var(--color-border); padding: .65rem 1rem; }
    .primary-button:disabled { cursor: not-allowed; opacity: .62; }
    .results-summary { color: var(--color-text-secondary); margin-bottom: 1rem; }
    .results-list { display: grid; gap: .9rem; }
    .result-row { display: grid; gap: .35rem; }
    .result-meta { display: flex; justify-content: space-between; gap: 1rem; color: var(--color-text-secondary); font-size: .92rem; }
    .result-meta strong { color: var(--color-text-primary); }
    .result-track { overflow: hidden; height: .7rem; border-radius: 999px; background: var(--color-surface); border: 1px solid var(--color-border); }
    .result-fill { display: block; height: 100%; min-width: .35rem; border-radius: inherit; background: linear-gradient(90deg, var(--color-primary), var(--color-secondary)); }
    footer { border-top: 1px solid var(--color-border); padding: 1.5rem 0 3rem; color: var(--color-accent); font-size: .9rem; }
    @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { .topbar-inner, .card-header { display: grid; } .card { padding: 1.25rem; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="/">ZOAK Solutions</a>
      <a class="home-link" href="/">Back to main site</a>
    </div>
  </header>

  <main>
    <div class="container">
      <section class="hero">
        <span class="eyebrow" id="pollSlugLabel">Poll</span>
        <h1 id="pollTitle">Loading poll...</h1>
        <p id="pollDescription" class="lede"></p>
        <div id="closeTimer" class="timer" aria-live="polite"></div>
        <div id="heroCandidateStrip" class="hero-strip" aria-label="Poll candidates"></div>
      </section>

      <div class="content-grid">
        <section id="voteCard" class="card" tabindex="-1">
          <div class="card-header">
            <div>
              <h2>Cast Your Vote</h2>
              <p>Use your unique email link to choose one option.</p>
            </div>
          </div>

          <form id="voteForm" novalidate>
            <div id="tokenNotice" class="notice"></div>
            <fieldset>
              <legend>Candidate <span>Required</span></legend>
              <div id="candidateChoices" class="option-grid"></div>
            </fieldset>
            <label for="comment">Comment <span>Optional</span></label>
            <textarea id="comment" name="comment" maxlength="500"></textarea>
            <div class="honeypot" aria-hidden="true">
              <label for="website">Website</label>
              <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
            </div>
            <div id="voteStatus" class="status" role="status" aria-live="polite"></div>
            <button id="submitButton" class="primary-button" type="submit">Cast vote</button>
          </form>
        </section>

        <section id="resultsCard" class="card">
          <div class="card-header">
            <div>
              <h2>Results</h2>
              <p>Aggregate counts only. Comments are not shown publicly.</p>
            </div>
            <button id="refreshResults" class="secondary-button" type="button">Refresh</button>
          </div>
          <div id="resultsSummary" class="results-summary">Loading results...</div>
          <div id="resultsList" class="results-list" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">© 2026 ZOAK Pty Ltd · ABN 68 161 531 880</div>
  </footer>

  <script src="/lunch-vote/poll-vote.js" defer></script>
</body>
</html>
