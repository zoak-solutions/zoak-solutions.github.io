# Example full-site stack for zoak.solutions plus the lunch-vote API.
# Adjust the published port, domain, and secrets for production.
services:
  zoak_site:
    image: caddy:2-alpine
    ports:
      - "${SITE_PUBLISH:-8088:80}"
    volumes:
      - ./:/srv:ro
    configs:
      - source: zoak_caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - lunch_vote_api
    restart: unless-stopped

  lunch_vote_api:
    build: ./lunch-vote-api
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - lunch_vote_data:/data
      - ${POLL_CONFIG_HOST_DIR:-./polls}:/polls:ro
    restart: unless-stopped

  lunch_vote_token_admin:
    build:
      context: ./lunch-vote-api
      dockerfile: Dockerfile.tokens
    env_file:
      - ${APP_ENV_FILE:-.env}
    profiles:
      - tools
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - lunch_vote_data:/data
      - ./local-sensitive:/work
      - ${POLL_CONFIG_HOST_DIR:-./polls}:/polls:ro
    restart: "no"

configs:
  zoak_caddyfile:
    content: |
      :80 {
        root * /srv
        encode zstd gzip

        handle_path /api/* {
          reverse_proxy lunch_vote_api:8080
        }

        @local_sensitive path /local-sensitive /local-sensitive/*
        respond @local_sensitive 404

        file_server
      }

volumes:
  lunch_vote_data:
